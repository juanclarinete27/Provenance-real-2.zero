name: Build Provenance Mocute N64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          brew install xcbeautify ldid 2>/dev/null || true

      - name: Global Pre-build Sanitizer (Xcode 16 / Clang)
        shell: bash
        run: |
          set -euo pipefail
          
          # Força o sed do macOS a tratar os arquivos como raw bytes, evitando erros de codificação
          export LC_ALL=C
          export LANG=C
          
          echo "=== A iniciar higienizacao global do codigo ==="

          # 1. Remover flags obsoletas ARM (-mfpu=... e -mno-thumb)
          find . -type f \( -name "*.pbxproj" -o -name "*.xcconfig" \) -exec sed -i '' \
            -e 's/[[:space:]]*-mfpu=[^"[:space:]]*//g' \
            -e 's/"-mfpu=[^"]*",//g' \
            -e 's/[[:space:]]*-mno-thumb//g' \
            -e 's/"-mno-thumb",//g' {} + || true

          # 2. Corrigir include de fp.h para math.h
          find . -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" \) -exec sed -i '' \
            's/<fp\.h>/<math\.h>/g' {} + || true

          # 3. Substituir referências à libstdc++ por libc++
          find . -type f -name "*.pbxproj" -exec sed -i '' \
            -e 's/libstdc++\.6\.0\.9/libc++/g' \
            -e 's/libstdc++/libc++/g' {} + || true

          echo "=== Higienizacao concluida com sucesso ==="

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Provenance.xcworkspace \
            -scheme Provenance-Release

      - name: Fix Byte Error
        run: |
          find . -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.c" \) -exec grep -l "typedef Byte FAR Bytef;" {} + | xargs perl -pi -e 's/typedef Byte FAR Bytef;/#include <stdint.h>\ntypedef uint8_t Byte;\ntypedef Byte FAR Bytef;/g' || true
      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -workspace Provenance.xcworkspace \
            -scheme Provenance-Release \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -archivePath "$RUNNER_TEMP/Provenance-Mocute.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            archive \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify

      - name: Print build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"

          if [ -f "$LOG" ]; then
            echo "===== COMPILER/LINKER ERRORS ====="
            grep -E ': (fatal )?error:' "$LOG" | tail -100 || true

            echo "===== FAILED BUILD COMMANDS ====="
            grep -A20 "The following build commands failed:" "$LOG" || true

            echo "===== LAST 100 RAW LOG LINES ====="
            tail -100 "$LOG"
          else
            echo "::warning::Raw xcodebuild log was not created."
          fi

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log-Provenance-Mocute-N64
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 3
          if-no-files-found: warn

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/Provenance-Mocute.xcarchive/Products/Applications/Provenance.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Provenance.app was not found in the archive."
            find "$RUNNER_TEMP/Provenance-Mocute.xcarchive" -maxdepth 5 -name "*.app" -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -pR "$APP_PATH" "Payload/Provenance.app"

          for d in PlugIns Watch Extensions; do
            rm -rf "Payload/Provenance.app/$d"
          done

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Provenance-Mocute-N64-NoExtensions.ipa

          echo "IPA created:"
          ls -lh Provenance-Mocute-N64-NoExtensions.ipa

      - name: Validate IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          test -f Provenance-Mocute-N64-NoExtensions.ipa

          echo "IPA size:"
          du -h Provenance-Mocute-N64-NoExtensions.ipa

          echo "IPA contents:"
          unzip -l Provenance-Mocute-N64-NoExtensions.ipa | head -30

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Provenance-Mocute-N64-NoExtensions
          path: Provenance-Mocute-N64-NoExtensions.ipa
          if-no-files-found: error
