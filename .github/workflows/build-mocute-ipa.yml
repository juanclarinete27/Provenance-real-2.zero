name: Build Provenance Mocute N64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Provenance.xcworkspace \
            -scheme Provenance-Release

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace Provenance.xcworkspace \
            -scheme Provenance-Release \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Provenance-Mocute.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/Provenance-Mocute.xcarchive/Products/Applications/Provenance.app"

          test -d "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Provenance.app

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Provenance-Mocute-N64.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Provenance-Mocute-N64
          path: Provenance-Mocute-N64.ipa
          if-no-files-found: error
